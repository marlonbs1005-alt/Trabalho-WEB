<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loja Tech - NextGen</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-body: #090d16;
            --card-bg: rgba(22, 31, 49, 0.65);
            --card-border: rgba(255, 255, 255, 0.08);
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --accent: #06b6d4;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            min-height: 100vh;
            padding: 2rem 1rem;
            display: flex;
            justify-content: center;
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(99, 102, 241, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 85% 85%, rgba(6, 182, 212, 0.12) 0%, transparent 40%);
        }

        .container {
            width: 100%;
            max-width: 1100px;
        }

        /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            padding: 1.25rem 2rem;
            border-radius: 20px;
            margin-bottom: 2.5rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #a5b4fc, var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .cart-status {
            background: rgba(99, 102, 241, 0.15);
            border: 1px solid rgba(99, 102, 241, 0.3);
            padding: 0.5rem 1.25rem;
            border-radius: 99px;
            font-weight: 600;
            font-size: 0.95rem;
        }

        .cart-status span {
            color: var(--accent);
            font-weight: 800;
        }

        /* Grid de Produtos */
        .section-title {
            font-size: 1.25rem;
            margin-bottom: 1.25rem;
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 1.5rem;
        }

        .product-card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .product-card:hover {
            transform: translateY(-6px);
            border-color: rgba(99, 102, 241, 0.4);
            box-shadow: 0 12px 25px rgba(0, 0, 0, 0.4), 0 0 20px rgba(99, 102, 241, 0.15);
        }

        .badge {
            align-self: flex-start;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 0.25rem 0.6rem;
            border-radius: 6px;
            margin-bottom: 1rem;
            text-transform: uppercase;
        }

        .badge-destaque {
            background: rgba(99, 102, 241, 0.2);
            color: #a5b4fc;
        }

        .badge-promocao {
            background: rgba(236, 72, 153, 0.2);
            color: #f472b6;
        }

        .product-name {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .product-price {
            font-size: 1.25rem;
            font-weight: 800;
            color: var(--accent);
            margin-bottom: 1.25rem;
        }

        .btn-buy {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.8rem;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.1s ease;
        }

        .btn-buy:hover {
            background: var(--primary-hover);
        }

        .btn-buy:active {
            transform: scale(0.97);
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
    <div>
        <h1>Loja Online</h1>
        <p style="font-size: 0.85rem; color: var(--text-muted); margin-top: 0.25rem;">
            Olá, <strong style="color: var(--text-main);">{{ usuario }}</strong>!
        </p>
    </div>
    
    <div style="display: flex; align-items: center; gap: 1rem;">
        <div class="cart-status">
            🛒 Carrinho: <span id="contador">0</span> itens
        </div>
        <a href="/logout" style="color: #f87171; text-decoration: none; font-weight: 600; font-size: 0.9rem;">Sair</a>
    </div>
</header>

        <h2 class="section-title">Catálogo de Produtos</h2>

        <div class="products-grid">
            <!-- Loop Jinja2 do Python para renderizar os produtos -->
            {% for produto in produtos %}
            <div class="product-card">
                <div>
                    <span class="badge {{ 'badge-destaque' if produto.badge == 'Destaque' else 'badge-promocao' }}">
                        {{ produto.badge }}
                    </span>
                    <h3 class="product-name">{{ produto.nome }}</h3>
                </div>
                <div>
                    <p class="product-price">{{ produto.preco }}</p>
                    <button class="btn-buy">Comprar</button>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>

    <script>
        let total = 0;
        const contador = document.getElementById('contador');
        
        document.querySelectorAll('.btn-buy').forEach(btn => {
            btn.addEventListener('click', () => {
                total++;
                contador.textContent = total;
            });
        });
    </script>
</body>
</html>
